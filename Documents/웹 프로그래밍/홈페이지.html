<!DOCTYPE HTML>
<html>

<head>
    <meta charset="UTF-8">
    <title>로그인 화면</title>
    <link rel="stylesheet" href="홈페이지.css">
</head>

<body>
    <!-- 로딩 오버레이 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>로그인 중...</p>
    </div>

    <div class="B3">
        <h2>로그인</h2>
        <form action="홈페이지2.html" method="get" id="loginForm">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" placeholder="아이디 입력" required />

            <label for="password">비밀번호</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="비밀번호 입력" required />
                <button type="button" class="toggle-password" id="togglePassword">
                    🙆‍♂️
                </button>
            </div>

            <!-- 로그인 상태 유지 체크박스 -->
            <div class="remember-me">
                <input type="checkbox" id="rememberMe" />
                <label for="rememberMe">로그인 상태 유지</label>
            </div>

            <!-- 에러 메시지 -->
            <div id="errorMessage" class="error-message"></div>

            <input type="submit" value="로그인" id="loginBtn" />
        </form>

        <!-- 비밀번호 찾기 -->
        <div class="forgot-password">
            <a href="비밀번호찾기.html">비밀번호를 잊으셨나요?</a>
        </div>

        <!-- 구분선 -->
        <div class="divider">
            <span>또는</span>
        </div>

        <!-- 소셜 로그인 -->
        <div class="social-login">
            <button class="social-btn google-btn">
                Google로 로그인
            </button>
            <button class="social-btn kakao-btn">
                Kakao로 로그인
            </button>
            <button class="social-btn naver-btn">
                Naver로 로그인
            </button>
        </div>

        <div class="footer-text">
            <a href="회원가입.html">회원가입</a>
        </div>
    </div>

    <script>
        // 1. 비밀번호 표시/숨김 토글
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '🙆‍♂️' : '🙅‍♂️';
        });

        // 2. 로그인 검증
        const loginForm = document.getElementById('loginForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault(); // 기본 폼 제출 방지

            // 에러 메시지 초기화
            errorMessage.textContent = '';
            errorMessage.style.display = 'none';

            // 입력값 가져오기
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // LocalStorage에서 등록된 계정 가져오기
            const users = JSON.parse(localStorage.getItem('users')) || [];

            // 계정 검증
            const user = users.find(u => u.username === username && u.password === password);

            if (user) {
                // 로그인 성공
                loadingOverlay.style.display = 'flex';

                // 로그인 상태 유지 체크
                const rememberMe = document.getElementById('rememberMe').checked;
                if (rememberMe) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                }

                // 홈페이지2.html로 이동
                setTimeout(() => {
                    window.location.href = '홈페이지2.html?username=' + encodeURIComponent(username);
                }, 1000);
            } else {
                // 로그인 실패
                errorMessage.textContent = '❌ 아이디 또는 비밀번호가 일치하지 않습니다.';
                errorMessage.style.display = 'block';

                // 2초 후 에러 메시지 자동으로 숨기기
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 2000);
            }
        });
    </script>
</body>

</html>
