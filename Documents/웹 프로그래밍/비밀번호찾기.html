<!DOCTYPE HTML>
<html>

<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>
    <link rel="stylesheet" href="비밀번호찾기.css">
</head>

<body>
    <!-- 로딩 오버레이 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>확인 중...</p>
    </div>

    <div class="B3">
        <h2>비밀번호 찾기</h2>

        <!-- 1단계: 계정 확인 -->
        <div id="step1" class="step-container">
            <p class="info-text">가입 시 입력한 아이디와 이메일을 입력해주세요.</p>
            <form id="verifyForm">
                <label for="username">아이디 *</label>
                <input type="text" id="username" placeholder="아이디 입력" required />

                <label for="email">이메일 *</label>
                <input type="email" id="email" placeholder="이메일 입력" required />

                <!-- 에러 메시지 -->
                <div id="errorMessage" class="error-message"></div>

                <input type="submit" value="계정 확인" />
            </form>
        </div>

        <!-- 2단계: 새 비밀번호 설정 (처음엔 숨김) -->
        <div id="step2" class="step-container" style="display: none;">
            <p class="success-text">✅ 계정이 확인되었습니다!</p>
            <p class="info-text">새로운 비밀번호를 설정해주세요.</p>
            <form id="resetForm">
                <label for="newPassword">새 비밀번호 *</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" placeholder="새 비밀번호 입력 (8자 이상)" required minlength="8" />
                    <button type="button" class="toggle-password" id="toggleNewPassword">
                        🙆‍♂️
                    </button>
                </div>

                <label for="confirmNewPassword">비밀번호 확인 *</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmNewPassword" placeholder="비밀번호 다시 입력" required />
                    <button type="button" class="toggle-password" id="toggleConfirmNewPassword">
                        🙆‍♂️
                    </button>
                </div>

                <!-- 에러 메시지 -->
                <div id="resetErrorMessage" class="error-message"></div>

                <input type="submit" value="비밀번호 재설정" />
            </form>
        </div>

        <div class="footer-text">
            <a href="홈페이지.html">로그인으로 돌아가기</a>
        </div>
    </div>

    <script>
        let verifiedUser = null; // 확인된 사용자 저장

        // 비밀번호 표시/숨김 토글
        const toggleNewPassword = document.getElementById('toggleNewPassword');
        const toggleConfirmNewPassword = document.getElementById('toggleConfirmNewPassword');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmNewPasswordInput = document.getElementById('confirmNewPassword');

        if (toggleNewPassword) {
            toggleNewPassword.addEventListener('click', function () {
                const type = newPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                newPasswordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '🙆‍♂️' : '🙅‍♂️';
            });
        }

        if (toggleConfirmNewPassword) {
            toggleConfirmNewPassword.addEventListener('click', function () {
                const type = confirmNewPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                confirmNewPasswordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '🙆‍♂️' : '🙅‍♂️';
            });
        }

        // 1단계: 계정 확인
        const verifyForm = document.getElementById('verifyForm');
        const errorMessage = document.getElementById('errorMessage');
        const loadingOverlay = document.getElementById('loadingOverlay');

        verifyForm.addEventListener('submit', function (e) {
            e.preventDefault();

            // 에러 메시지 초기화
            errorMessage.textContent = '';
            errorMessage.style.display = 'none';

            // 입력값 가져오기
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;

            // LocalStorage에서 사용자 찾기
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const user = users.find(u => u.username === username && u.email === email);

            if (user) {
                // 계정 확인 성공
                verifiedUser = user;
                loadingOverlay.style.display = 'flex';

                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                }, 1000);
            } else {
                // 계정 확인 실패
                errorMessage.textContent = '❌ 일치하는 계정 정보가 없습니다.';
                errorMessage.style.display = 'block';

                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 2000);
            }
        });

        // 2단계: 비밀번호 재설정
        const resetForm = document.getElementById('resetForm');
        const resetErrorMessage = document.getElementById('resetErrorMessage');

        resetForm.addEventListener('submit', function (e) {
            e.preventDefault();

            // 에러 메시지 초기화
            resetErrorMessage.textContent = '';
            resetErrorMessage.style.display = 'none';

            // 입력값 가져오기
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            // 유효성 검사
            if (newPassword !== confirmNewPassword) {
                resetErrorMessage.textContent = '❌ 비밀번호가 일치하지 않습니다.';
                resetErrorMessage.style.display = 'block';
                setTimeout(() => {
                    resetErrorMessage.style.display = 'none';
                }, 2000);
                return;
            }

            if (newPassword.length < 8) {
                resetErrorMessage.textContent = '❌ 비밀번호는 8자 이상이어야 합니다.';
                resetErrorMessage.style.display = 'block';
                setTimeout(() => {
                    resetErrorMessage.style.display = 'none';
                }, 2000);
                return;
            }

            // 비밀번호 업데이트
            loadingOverlay.style.display = 'flex';
            loadingOverlay.querySelector('p').textContent = '비밀번호 재설정 중...';

            const users = JSON.parse(localStorage.getItem('users')) || [];
            const userIndex = users.findIndex(u => u.username === verifiedUser.username);

            if (userIndex !== -1) {
                users[userIndex].password = newPassword;
                localStorage.setItem('users', JSON.stringify(users));

                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                    alert('✅ 비밀번호가 성공적으로 재설정되었습니다!\n\n새 비밀번호로 로그인해주세요.');
                    window.location.href = '홈페이지.html';
                }, 1500);
            }
        });
    </script>
</body>

</html>
