<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 & MP4 플레이어</title>
    <link rel="stylesheet" href="5.css">
</head>
<body>

    <h1>오디오 비디오 플레이어</h1>

    <div>
        <h2>오디오 재생 (MP3)</h2>
        <audio controls>
            <source src="EmbraceableYou.mp3" type="audio/mpeg">
            이 브라우저는 audio 태그를 지원하지 않습니다.
        </audio>
    </div>

    <div>
        <h2>비디오 재생 (MP4)</h2>
        <video width="600" controls>
            <source src="Frozen-360p.mp4" type="video/mp4">
            이 브라우저는 video 태그를 지원하지 않습니다.
        </video>
    </div>
</body>
</html>
