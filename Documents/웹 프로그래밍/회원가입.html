<!DOCTYPE HTML>
<html>

<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" href="회원가입.css">
</head>

<body>
    <!-- 로딩 오버레이 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>계정 생성 중...</p>
    </div>

    <div class="B3">
        <h2>회원가입</h2>
        <form id="signupForm">
            <label for="username">아이디 *</label>
            <input type="text" id="username" placeholder="아이디 입력 (4-12자)" required minlength="4" maxlength="12" />

            <label for="email">이메일 *</label>
            <input type="email" id="email" placeholder="이메일 입력" required />

            <label for="password">비밀번호 *</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="비밀번호 입력 (8자 이상)" required minlength="8" />
                <button type="button" class="toggle-password" id="togglePassword">
                    🙆‍♂️
                </button>
            </div>

            <label for="confirmPassword">비밀번호 확인 *</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword" placeholder="비밀번호 다시 입력" required />
                <button type="button" class="toggle-password" id="toggleConfirmPassword">
                    🙆‍♂️
                </button>
            </div>

            <!-- 에러 메시지 -->
            <div id="errorMessage" class="error-message"></div>

            <input type="submit" value="회원가입" id="signupBtn" />
        </form>

        <div class="footer-text">
            이미 계정이 있으신가요? <a href="홈페이지.html">로그인</a>
        </div>
    </div>

    <script>
        // 비밀번호 표시/숨김 토글
        const togglePassword = document.getElementById('togglePassword');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '🙆‍♂️' : '🙅‍♂️';
        });

        toggleConfirmPassword.addEventListener('click', function () {
            const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPasswordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '🙆‍♂️' : '🙅‍♂️';
        });

        // 회원가입 폼 제출
        const signupForm = document.getElementById('signupForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorMessage = document.getElementById('errorMessage');

        signupForm.addEventListener('submit', function (e) {
            e.preventDefault();

            // 에러 메시지 초기화
            errorMessage.textContent = '';
            errorMessage.style.display = 'none';

            // 입력값 가져오기
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // 유효성 검사
            if (password !== confirmPassword) {
                errorMessage.textContent = '❌ 비밀번호가 일치하지 않습니다.';
                errorMessage.style.display = 'block';
                return;
            }

            if (password.length < 8) {
                errorMessage.textContent = '❌ 비밀번호는 8자 이상이어야 합니다.';
                errorMessage.style.display = 'block';
                return;
            }

            // 로딩 표시
            loadingOverlay.style.display = 'flex';

            // LocalStorage에 사용자 저장
            const users = JSON.parse(localStorage.getItem('users')) || [];

            // 중복 아이디 체크
            const existingUser = users.find(u => u.username === username);
            if (existingUser) {
                loadingOverlay.style.display = 'none';
                errorMessage.textContent = '❌ 이미 존재하는 아이디입니다.';
                errorMessage.style.display = 'block';
                return;
            }

            // 새 사용자 추가
            users.push({
                username: username,
                email: email,
                password: password
            });

            // LocalStorage에 저장
            localStorage.setItem('users', JSON.stringify(users));

            // 실제로는 서버에 요청을 보내지만, 여기서는 시뮬레이션
            setTimeout(() => {
                loadingOverlay.style.display = 'none';
                alert('✅ 회원가입이 완료되었습니다!\n\n아이디: ' + username + '\n이메일: ' + email);
                // 로그인 페이지로 이동
                window.location.href = '홈페이지.html';
            }, 1500);
        });
    </script>
</body>

</html>
